<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odisha One QR</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Oriya:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surface:#f3f5f9;--line:#dde3ee;--ink:#0b1f44;--mute:#52607d;--navy:#0b2a5b;--blue:#1d5fd1;--green:#12805c;--greenbg:#e3f4ec;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1220;--surface:#142038;--line:#26385c;--ink:#e8eefc;--mute:#9db0d6;--navy:#8db4ff;--blue:#6ea2ff;--green:#4fd1a0;--greenbg:#0f3a2c;--on:#0a1220}}
:root[data-theme="dark"]{--bg:#0a1220;--surface:#142038;--line:#26385c;--ink:#e8eefc;--mute:#9db0d6;--navy:#8db4ff;--blue:#6ea2ff;--green:#4fd1a0;--greenbg:#0f3a2c;--on:#0a1220}
html{scroll-padding-top:70px;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible","Noto Sans Oriya",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,p{margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:20}
.bar{display:flex;align-items:center;gap:14px;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--navy);cursor:pointer;background:none;border:0;padding:0;font-family:inherit}
.qr{width:30px;height:30px;border-radius:7px;background:var(--navy);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:2px;padding:5px}
.qr i{background:var(--bg)}.qr i:nth-child(2n){background:transparent}
nav{margin-left:auto;display:flex;gap:6px;align-items:center}
nav button,select{font:inherit;font-size:15px;color:var(--ink);background:none;border:0;padding:10px 12px;border-radius:8px;cursor:pointer}
select{border:1px solid var(--line);background:var(--bg)}
nav button:hover{background:var(--surface)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hero{padding:44px 0 28px}
.hero h1{font-size:clamp(32px,6vw,52px);line-height:1.1;color:var(--navy);max-width:16ch;letter-spacing:-.01em}
.hero p{margin-top:14px;color:var(--mute);max-width:46ch;font-size:19px}
.scan{display:inline-flex;align-items:center;gap:8px;margin-top:18px;background:var(--greenbg);color:var(--green);padding:7px 14px;border-radius:99px;font-weight:700;font-size:15px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}


.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:6px}
.card .code{font-size:26px;font-weight:700;color:var(--navy)}
.card .full{color:var(--mute);font-size:15px}
.card .reg{font-size:14px;color:var(--blue);font-weight:700}
.btn{margin-top:12px;min-height:52px;border:0;border-radius:12px;background:var(--navy);color:var(--on);font:inherit;font-weight:700;cursor:pointer;padding:0 20px}
.btn:hover{background:var(--blue)}
.btn.ghost{background:none;color:var(--navy);border:2px solid var(--navy)}
section{padding:40px 0}
section>.wrap>h2{font-size:28px;color:var(--navy);margin-bottom:6px}
.sub{color:var(--mute);margin-bottom:22px;max-width:60ch}
.steps{counter-reset:s;display:grid;gap:12px}
.step{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.step::before{counter-increment:s;content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:var(--green);color:var(--on);display:grid;place-items:center;font-weight:700}
.step b{display:block;color:var(--navy)}.step span{color:var(--mute);font-size:15px}

.note{margin-top:16px;padding:14px 16px;border-left:4px solid var(--green);background:var(--greenbg);border-radius:8px;font-size:16px}
.warn{border-color:#c2410c;background:rgba(194,65,12,.1)}
ul.tick{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
ul.tick li{padding-left:26px;position:relative;font-size:16px}
ul.tick li::before{content:"✓";position:absolute;left:0;color:var(--green);font-weight:700}
.crumb{display:flex;align-items:center;gap:12px;padding:18px 0 4px;flex-wrap:wrap}
.back{min-height:44px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:0 16px;font:inherit;cursor:pointer}
.chip{background:var(--greenbg);color:var(--green);font-weight:700;padding:6px 14px;border-radius:99px;font-size:15px}
.app{align-items:center;text-align:center}
.mark{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:22px}
.center{text-align:center;padding:70px 0}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--green);margin:0 auto 22px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}html{scroll-behavior:auto}}
.hand{display:flex;align-items:center;justify-content:center;gap:12px;margin:22px 0;color:var(--mute);font-size:15px;flex-wrap:wrap}
.hand div{padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.demo{display:grid;gap:26px;padding:26px 0 50px}
@media(min-width:860px){.demo{grid-template-columns:340px 1fr;align-items:start}}
.phone{width:100%;max-width:340px;margin:0 auto;border:10px solid #111;border-radius:34px;background:#fff;color:#1a1a1a;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.ptop{padding:16px;color:#fff;font-weight:700}
.pbody{padding:16px;display:grid;gap:12px;min-height:380px;align-content:start}
.pbody small{color:#667}
.prow{border:1px solid #dde;border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:8px;font-size:15px}
.pbtn{border-radius:10px;padding:12px;text-align:center;font-weight:700;color:#fff;font-size:15px}
.sim{background:#fff3cd;color:#664d03;text-align:center;font-size:13px;padding:6px;font-weight:700}
footer{background:var(--navy);color:var(--on);padding:34px 0;margin-top:20px}
footer p{max-width:60ch}footer .big{font-size:21px;font-weight:700;margin-bottom:8px}
.tg{display:flex;border:2px solid var(--navy);border-radius:10px;overflow:hidden}.tg button{border-radius:0;font-weight:700;padding:8px 12px}.tg button.on{background:var(--navy);color:var(--on)}
.step{flex-direction:column;position:relative}.step::before{position:absolute;top:10px;left:10px;z-index:1}
.ill{width:100%;height:auto;max-height:130px;background:var(--bg);border-radius:10px;padding:8px}.ill.em{display:grid;place-items:center;font-size:48px;height:100px;line-height:1}
.nl{display:none}
.demo.single{grid-template-columns:1fr;padding:18px 0 40px}.phone{max-width:380px}@media(max-width:600px){.phone{border:0;border-radius:0;box-shadow:none}.demo.single{padding:0 0 30px}.wrap:has(.demo.single){padding:0}}
body.app header,body.app footer,body.app::before{display:none}body.app .wrap{padding:0;max-width:none}body.app .demo.single{padding:0}body.app .phone{max-width:480px;border:0;border-radius:0;box-shadow:none;margin:0 auto}
.grid.logos{grid-template-columns:1fr 1fr;gap:16px;max-width:460px}.tile{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:22px;cursor:pointer;display:grid;place-items:center;padding:12px;font:inherit}.tile:active{transform:scale(.97)}.dl{width:100%;max-width:140px;aspect-ratio:1;border-radius:50%;background:#fff;border:4px solid;display:grid;place-items:center;font-weight:700;font-size:clamp(13px,4vw,21px)}.mark.big{width:100%;max-width:120px;height:auto;aspect-ratio:1;border-radius:26px;font-size:clamp(28px,9vw,44px)}
.tile{aspect-ratio:auto;background:#fff;color:#111;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;padding:16px 10px;min-height:150px}.tile img{width:100%;max-height:84px;object-fit:contain}.cap{display:grid;gap:3px;text-align:center}.cap b{font-size:17px;color:#0b2a5b}.cap small{font-size:12.5px;color:#52607d;line-height:1.3}
html{background:#e9ecf3}body{max-width:480px;margin:0 auto;min-height:100vh;box-shadow:0 0 30px rgba(0,0,0,.12)}@media(prefers-color-scheme:dark){html{background:#05080f}}body.app .phone{max-width:none}
</style>
</head>
